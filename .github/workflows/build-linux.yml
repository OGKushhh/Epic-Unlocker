# Build Epic Unlocker — Linux
#
# Companion doc: Docs/LINUX_PORT_ANALYSIS.md (§10)
#
# This workflow builds the Linux port of Epic Unlocker. It is designed to be
# enabled incrementally as the port progresses through the phases in the doc:
#
#   Phase 1 — EpicGUI Linux port           →  job: epicgui       (enable first)
#   Phase 2 — CI worker (this file)        →  you are here
#   Phase 3 — ScreamAPI .so port           →  job: screamapi     (enable when Phase 3 lands)
#   Phase 4 — Overlay Vulkan layer port    →  job: overlay       (enable when Phase 4 lands)
#   Phase 5 — Polish & release             →  job: release       (enable when ready to ship)
#
# Each job is independently gated by a file-existence check on a CMakeLists.txt
# or marker file. To enable a job, just create the marker file referenced in
# its `if:` condition. Until then, the job is skipped with a clear message.
#
# Branch protection: this workflow is safe to run on every push to `main` and
# on every PR. The release job only runs on tagged commits (v*).

name: Build Linux

on:
  push:
    branches: [main, linux-port]
    tags: ['v*']
    paths:
      - 'EpicGUI/**'
      - 'ScreamAPI/**'
      - 'Overlay/**'
      - '.github/workflows/build-linux.yml'
      - 'scripts/smoke-test-*.sh'
  pull_request:
    branches: [main]
    paths:
      - 'EpicGUI/**'
      - 'ScreamAPI/**'
      - 'Overlay/**'
      - '.github/workflows/build-linux.yml'
      - 'scripts/smoke-test-*.sh'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with debug logging'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

# Default permissions — least privilege. Jobs that need more (e.g. release)
# override this at the job level.
permissions:
  contents: read

# Cancel in-flight runs when a new commit lands on the same ref.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  #  EpicGUI — Tauri desktop app (Phase 1)
  # ─────────────────────────────────────────────────────────────────────
  epicgui:
    name: EpicGUI (Tauri)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: EpicGUI/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'EpicGUI/src-tauri'

      - name: Verify Rust code compiles on Linux
        working-directory: EpicGUI/src-tauri
        run: cargo check --target x86_64-unknown-linux-gnu

      - name: Audit Rust dependencies for known CVEs
        working-directory: EpicGUI/src-tauri
        # Don't fail the build on audit findings — surface them as warnings
        # so we get visibility without blocking. Promote to fail-on-warning
        # once the current backlog is cleared.
        continue-on-error: true
        run: |
          cargo install cargo-audit --quiet || true
          cargo audit 2>&1 | tee audit-report.txt
          echo "### Rust dependency audit" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Install npm dependencies
        working-directory: EpicGUI
        run: npm ci

      - name: Build Tauri app
        working-directory: EpicGUI
        run: npm run tauri build
        env:
          # Hide the Tauri dev-server console output noise in CI
          TAURI_CI: 'true'

      - name: List build artifacts
        if: always()
        run: |
          echo "### Build artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find EpicGUI/src-tauri/target/release/bundle -type f 2>/dev/null | sort >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpicGUI-linux-deb
          path: EpicGUI/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload .AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpicGUI-linux-appimage
          path: EpicGUI/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug symbols (if any)
        uses: actions/upload-artifact@v4
        with:
          name: EpicGUI-linux-debug
          path: EpicGUI/src-tauri/target/release/EpicGUI*
            !EpicGUI/src-tauri/target/release/EpicGUI
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  #  ScreamAPI — EOS SDK proxy .so (Phase 3)
  # ─────────────────────────────────────────────────────────────────────
  screamapi:
    name: ScreamAPI (.so)
    runs-on: ubuntu-22.04
    # Enable this job by creating ScreamAPI/CMakeLists.txt
    # (Phase 3 of LINUX_PORT_ANALYSIS.md). The first step below checks for
    # that file and sets skip=true if missing, which gates all subsequent steps.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if ScreamAPI Linux port exists
        id: check
        run: |
          if [ -f ScreamAPI/CMakeLists.txt ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "ScreamAPI/CMakeLists.txt found — running ScreamAPI build"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ScreamAPI/CMakeLists.txt not found — skipping ScreamAPI job (Phase 3 not started yet)."
          fi

      - name: Install build dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config

      - name: Configure CMake
        if: steps.check.outputs.skip != 'true'
        run: |
          cmake -B build -S ScreamAPI \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: cmake --build build --parallel --verbose

      - name: Smoke test — verify .so loads and exports expected symbols
        if: steps.check.outputs.skip != 'true'
        run: |
          chmod +x scripts/smoke-test-screamapi.sh
          ./scripts/smoke-test-screamapi.sh build/libScreamAPI.so

      - name: Upload .so artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ScreamAPI-linux-so
          path: build/libScreamAPI.so
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  #  Overlay — Vulkan layer .so + JSON manifest (Phase 4)
  # ─────────────────────────────────────────────────────────────────────
  overlay:
    name: Overlay (Vulkan layer)
    runs-on: ubuntu-22.04
    # Enable this job by creating Overlay/CMakeLists.txt
    # (Phase 4 of LINUX_PORT_ANALYSIS.md). The first step below checks for
    # that file and sets skip=true if missing, which gates all subsequent steps.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if Overlay Linux port exists
        id: check
        run: |
          if [ -f Overlay/CMakeLists.txt ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Overlay/CMakeLists.txt found — running Overlay build"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Overlay/CMakeLists.txt not found — skipping Overlay job (Phase 4 not started yet)."
          fi

      - name: Install build dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libvulkan-dev \
            libx11-dev \
            libxi-dev \
            libxxf86vm-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev

      - name: Configure CMake
        if: steps.check.outputs.skip != 'true'
        run: |
          cmake -B build -S Overlay \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: cmake --build build --parallel --verbose

      - name: Verify Vulkan layer manifest is valid JSON
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ ! -f build/EpicOverlay.json ]; then
            echo "::error::EpicOverlay.json not found in build output"
            exit 1
          fi
          python3 -c "import json; json.load(open('build/EpicOverlay.json'))"
          echo "EpicOverlay.json is valid JSON"

      - name: Upload overlay artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Overlay-linux
          path: |
            build/libEpicOverlay.so
            build/EpicOverlay.json
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  #  Release — bundle everything and publish as a draft GitHub Release
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Draft GitHub Release
    runs-on: ubuntu-22.04
    # Only on tagged commits, and only if at least EpicGUI built successfully.
    # ScreamAPI and Overlay are optional — the release bundles whatever exists.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [epicgui]
    # The release job needs to write to releases and upload assets.
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "### Downloaded artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find artifacts -type f | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Stage release bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          STAGE_DIR="EpicUnlocker-Linux-${VERSION}"
          mkdir -p "${STAGE_DIR}"

          # EpicGUI installers
          find artifacts/EpicGUI-linux-deb -name '*.deb' -exec cp {} "${STAGE_DIR}/" \; 2>/dev/null || true
          find artifacts/EpicGUI-linux-appimage -name '*.AppImage' -exec cp {} "${STAGE_DIR}/" \; 2>/dev/null || true

          # ScreamAPI .so (optional)
          if [ -f artifacts/ScreamAPI-linux-so/libScreamAPI.so ]; then
            mkdir -p "${STAGE_DIR}/screamapi"
            cp artifacts/ScreamAPI-linux-so/libScreamAPI.so "${STAGE_DIR}/screamapi/"
          fi

          # Overlay (optional)
          if [ -d artifacts/Overlay-linux ]; then
            mkdir -p "${STAGE_DIR}/overlay"
            cp artifacts/Overlay-linux/* "${STAGE_DIR}/overlay/" 2>/dev/null || true
          fi

          # README pointing at the docs
          cat > "${STAGE_DIR}/INSTALL.md" <<EOF
          # Epic Unlocker — Linux ${VERSION}

          See Docs/LINUX_PORT_ANALYSIS.md for installation instructions.
          See Docs/EGLv2_Manifest_Format.md for v2 launcher manifest support details.

          ## Components in this bundle

          EOF
          find "${STAGE_DIR}" -type f -printf '- %P (%s bytes)\n' | sort >> "${STAGE_DIR}/INSTALL.md"

          # Create the tarball
          tar czf "${STAGE_DIR}.tar.gz" "${STAGE_DIR}"
          sha256sum "${STAGE_DIR}.tar.gz" > "${STAGE_DIR}.tar.gz.sha256"

          echo "### Release bundle" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh "${STAGE_DIR}.tar.gz" "${STAGE_DIR}.tar.gz.sha256" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Linux artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          # Only upload files — don't overwrite existing release name/body
          preserve_existing: true
          files: |
            EpicUnlocker-Linux-*.tar.gz
            EpicUnlocker-Linux-*.tar.gz.sha256
          fail_on_unmatched_files: true
